name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: esprit
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: esprit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: esprit.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir artifact
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} artifact/
          tar -czf esprit-${{ matrix.target }}.tar.gz -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esprit-${{ matrix.target }}
          path: esprit-${{ matrix.target }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
