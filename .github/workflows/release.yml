name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            binary: esprit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            binary: esprit.exe
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
            binary: esprit
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: macos-x86_64
            binary: esprit

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p esprit-cli

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
            cd dist
            7z a "../esprit-${VERSION}-${{ matrix.artifact }}.zip" "${{ matrix.binary }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
            tar -C dist -czf "esprit-${VERSION}-${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}"
          fi

      - name: Checksums
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            sha256sum "esprit-"*.zip > "esprit-${GITHUB_REF_NAME#v}-${{ matrix.artifact }}.sha256"
          else
            sha256sum "esprit-"*.tar.gz > "esprit-${GITHUB_REF_NAME#v}-${{ matrix.artifact }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            esprit-*.tar.gz
            esprit-*.zip
            esprit-*.sha256

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
