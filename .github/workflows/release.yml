name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: esprit-aarch64-apple-darwin
            binary: esprit
          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: esprit-x86_64-apple-darwin
            binary: esprit
          # Linux x86_64 (static musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: esprit-x86_64-unknown-linux-musl
            binary: esprit
          # Linux ARM64 (static musl)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: esprit-aarch64-unknown-linux-musl
            binary: esprit

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ───────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Build dependencies (macOS) ───────────────────────────────────────────
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      # ── Build dependencies (Linux) ───────────────────────────────────────────
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake musl-tools gcc-aarch64-linux-gnu

      # ── Cross-compile setup for Linux ARM64 ──────────────────────────────────
      - name: Configure cross-compilation (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          echo "[target.aarch64-unknown-linux-musl]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      # ── Build release binary ─────────────────────────────────────────────────
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p esprit-cli
        env:
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_STRIP: "symbols"

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          OUT="${{ matrix.artifact }}"
          mkdir -p dist
          cp "$BIN" "dist/esprit"
          chmod +x dist/esprit
          tar -czf "dist/${OUT}.tar.gz" -C dist esprit
          sha256sum "dist/${OUT}.tar.gz" > "dist/${OUT}.tar.gz.sha256"
          echo "## SHA-256" >> $GITHUB_STEP_SUMMARY
          cat "dist/${OUT}.tar.gz.sha256" >> $GITHUB_STEP_SUMMARY

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # ── Create GitHub Release ─────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          REPO="${{ github.repository }}"

          compute_sha() {
            cat "artifacts/$1/$1.tar.gz.sha256" | awk '{print $1}'
          }

          MAC_ARM=$(compute_sha esprit-aarch64-apple-darwin)
          MAC_X86=$(compute_sha esprit-x86_64-apple-darwin)
          LIN_X86=$(compute_sha esprit-x86_64-unknown-linux-musl)
          LIN_ARM=$(compute_sha esprit-aarch64-unknown-linux-musl)

          cat > packaging/homebrew/esprit.rb << EOF
          class Esprit < Formula
            desc "AI workspace and operating layer — fully offline, no Ollama required"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/esprit-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/esprit-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X86}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/esprit-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${LIN_ARM}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/esprit-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LIN_X86}"
              end
            end

            def install
              bin.install "esprit"
            end

            def post_install
              ohai "Esprit installed!"
              ohai "Run: esprit init   — to download the default AI model (~390 MB)"
              ohai "Then: esprit ask \"what does this project do?\""
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/esprit --version")
            end
          end
          EOF

          echo "Formula updated for v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
