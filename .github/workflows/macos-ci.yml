name: macOS CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p esprit-cli --all-targets -- -D warnings
      - run: cargo test -p esprit-cli
      - run: cargo build -p esprit-cli --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/esprit dist/esprit
          tar -czf "esprit-0.1.0-macos-${{ matrix.arch }}.tar.gz" -C dist esprit

      - uses: actions/upload-artifact@v4
        with:
          name: esprit-macos-${{ matrix.arch }}
          path: esprit-0.1.0-macos-${{ matrix.arch }}.tar.gz
