name: macOS CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15
        arch:
          - arm64
          - x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/esprit dist/esprit
          tar -czf "esprit-${{ github.ref_name }}-macos-${{ matrix.arch }}.tar.gz" -C dist esprit

      - uses: actions/upload-artifact@v4
        with:
          name: esprit-macos-${{ matrix.arch }}
          path: esprit-*-macos-${{ matrix.arch }}.tar.gz
