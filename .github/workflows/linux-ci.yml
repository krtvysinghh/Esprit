name: Linux CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - fedora-latest
        arch:
          - x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          elif command -v dnf >/dev/null; then
            sudo dnf install -y gcc gcc-c++ make pkg-config glib2-devel gtk3-devel webkit2gtk4.1-devel libayatana-appindicator-gtk3-devel librsvg2-devel
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/esprit dist/esprit
          tar -czf "esprit-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" -C dist esprit

      - uses: actions/upload-artifact@v4
        with:
          name: esprit-linux-${{ matrix.os }}-${{ matrix.arch }}
          path: esprit-*-linux-${{ matrix.arch }}.tar.gz
