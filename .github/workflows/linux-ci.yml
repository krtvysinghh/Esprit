name: Linux CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p esprit-cli --all-targets -- -D warnings
      - run: cargo test -p esprit-cli
      - run: cargo build -p esprit-cli --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/esprit dist/esprit
          tar -czf esprit-0.1.0-linux-x86_64.tar.gz -C dist esprit

      - uses: actions/upload-artifact@v4
        with:
          name: esprit-linux-x86_64
          path: esprit-0.1.0-linux-x86_64.tar.gz
