[workspace]
resolver = "3"

members = [
    "apps/cli",

    "crates/core",
    "crates/config",
    "crates/filesystem",
    "crates/platform",
    "crates/search",
    "crates/ai"
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]

anyhow="1"

clap={version="4.5",features=["derive"]}

tracing="0.1"

tracing-subscriber={version="0.3",features=["env-filter"]}

serde={version="1",features=["derive"]}

toml="0.9"

camino="1"

walkdir="2"

regex="1"

once_cell="1"
