[workspace]
resolver = "3"

members = [
    "apps/cli",
    "crates/esprit-core",
    "crates/esprit-config",
    "crates/esprit-filesystem",
    "crates/esprit-platform",
    "crates/esprit-search",
    "crates/esprit-ai",
    "crates/esprit-index"
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
walkdir = "2"
regex = "1"
once_cell = "1"
camino = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
