[workspace]
resolver = "3"

members = [
    "tools/esprit-builder",
]

default-members = [
    "tools/esprit-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Kartavya Singh"]
description = "Esprit - AI Operating Layer"
repository = "https://github.com/krtvysingh/Esprit"

[workspace.dependencies]
anyhow = "1.0"
camino = "1.2"
cargo_toml = "0.22"
clap = { version = "4.5", features = ["derive"] }
convert_case = "0.8"
dialoguer = "0.12"
fs_extra = "1.3"
include_dir = "0.7"
indicatif = "0.18"
once_cell = "1.21"
owo-colors = "4"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2.5"

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
