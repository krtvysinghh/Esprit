[workspace]
resolver = "3"

members = [
    "apps/esprit-cli",

    "crates/esprit-core",
    "crates/esprit-config",
    "crates/esprit-filesystem",
    "crates/esprit-search",
    "crates/esprit-rag",
    "crates/esprit-memory",
    "crates/esprit-agents",
    "crates/esprit-workflows",
    "crates/esprit-embeddings",
    "crates/esprit-index",
    "crates/esprit-ai",
    "crates/esprit-platform"
, "crates/esprit-memory",
    "crates/esprit-agents",
    "crates/esprit-workflows", "crates/esprit-agents",
    "crates/esprit-workflows", "crates/esprit-workflows"]

default-members = [
    "apps/esprit-cli"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Kartavya Singh"]
rust-version = "1.88"

[workspace.dependencies]

anyhow = "1"

clap = { version = "4.5", features = ["derive"] }

serde = { version = "1", features = ["derive"] }

serde_json = "1"

toml = "0.9"

walkdir = "2"

ignore = "0.4"

globset = "0.4"

regex = "1"

rayon = "1"

sha2 = "0.11"

chrono = { version = "0.4", features = ["serde"] }

camino = "1"

directories = "6"

once_cell = "1"

parking_lot = "0.12"

thiserror = "2"

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sysinfo = "0.37"

indicatif = "0.18"

owo-colors = "4"

notify = "8"

rusqlite = { version = "0.37", features = ["bundled"] }

tantivy = "0.25"

tokio = { version = "1", features = ["full"] }

reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
