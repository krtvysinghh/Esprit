app-id: org.krtvysingh.Esprit
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: esprit

finish-args:
  - --share=network
  - --filesystem=home

modules:
  - name: esprit
    buildsystem: simple
    build-commands:
      - install -Dm755 target/release/esprit /app/bin/esprit
    sources:
      - type: dir
        path: ../../..
