[package]
name = "esprit-cli"
version.workspace = true
edition.workspace = true
description = "Esprit AI workspace component"
license = "MIT"
repository = "https://github.com/krtvysinghh/Esprit"
homepage = "https://github.com/krtvysinghh/Esprit"
documentation = "https://github.com/krtvysinghh/Esprit"
readme = "README.md"

[[bin]]
name = "esprit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true

esprit-core = { workspace = true, path = "../../crates/esprit-core" }
esprit-config = { workspace = true, path = "../../crates/esprit-config" }
esprit-platform = { workspace = true, path = "../../crates/esprit-platform" }
esprit-search = { workspace = true, path = "../../crates/esprit-search" }
esprit-filesystem = { workspace = true, path = "../../crates/esprit-filesystem" }
esprit-index = { workspace = true, path = "../../crates/esprit-index" }

esprit-ai = { workspace = true, path = "../../crates/esprit-ai" }

esprit-rag = { workspace = true, path = "../../crates/esprit-rag" }

esprit-agents = { workspace = true, path = "../../crates/esprit-agents" }

esprit-workflows = { workspace = true, path = "../../crates/esprit-workflows" }
